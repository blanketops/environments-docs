# Automated dependency updates. Three ecosystems: npm (the Docusaurus site
# itself), Go modules (cmd/server, the ko-shipped static file server), and
# GitHub Actions (the workflow files under .github/workflows/). PRs target
# develop, matching every other PR in this repo's branch flow — release
# branches cut from develop, not from dependency-update PRs directly.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    # Packages that must move together. Separate PRs for them each fail the
    # build: react and react-dom must be the exact same version, and the
    # Docusaurus packages must all be on one release.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      docusaurus:
        patterns:
          - "@docusaurus/*"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
