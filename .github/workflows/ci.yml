name: CI
# =============================================================================
# ci.yml — CI Build

# Build/typecheck safety net, independent of Netlify's own build.
# Netlify deploying successfully doesn't block a PR merge by default;
# this does, once required as a branch protection check.
# =============================================================================
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck

      - name: Build (catches broken links/anchors)
        id: build
        run: npm run build

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📊 CI Summary — ${{ github.event_name }} (`${{ github.ref_name }}`)

          | Step | Result |
          | :--- | :--- |
          | **Typecheck** | ${{ steps.typecheck.outcome }} |
          | **Build (broken-link check)** | ${{ steps.build.outcome }} |

          **Commit:** `${{ github.sha }}`
          EOF
