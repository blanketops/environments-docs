# Manually-triggered: second step of the release flow. Merges the
# release/<version> branch into main, tags the release (which triggers
# release.yml + ko.yml), syncs main back into develop, then deletes the release branch.
name: Finalize Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to finalize (e.g. v0.1.0)"
        required: true
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      # GH_PAT (not the default GITHUB_TOKEN) is required — pushing the tag
      # below must trigger ko.yml and release.yml, which GitHub's default
      # token is intentionally prevented from doing. This is why tagging
      # v0.0.4/v0.0.5 with the default token never fired either workflow.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff origin/release/${{ github.event.inputs.version }} \
            -m "release: merge release/${{ github.event.inputs.version }} into main"
          git push origin main

      # Pushing this tag is what kicks off release.yml (changelog, GitHub Release)
      # and ko.yml (image build/push) — both trigger on the same tag push.
      - name: Tag release
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Merge main back into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge --no-ff origin/main \
            -m "chore: sync develop with main after release/${{ github.event.inputs.version }}"
          git push origin develop

      - name: Delete release branch
        run: |
          git push origin --delete release/${{ github.event.inputs.version }}

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🎉 Release Finalized: \`${{ github.event.inputs.version }}\`
          ## Completed
          - Merged \`release/${{ github.event.inputs.version }}\` into \`main\`
          - Created Git tag \`${{ github.event.inputs.version }}\`
          - Synced \`main\` back into \`develop\`
          - Deleted release branch
          ## Branch Flow
          - release/${{ github.event.inputs.version }} → main → develop
          ## Next Steps
          - Pushing the tag triggers the **Release** workflow, which builds/pushes the GHCR image and generates the changelog + GitHub Release.
          EOF
