# Ko Image Build → GHCR
#
# Builds the Docusaurus site, bundles it as ko kodata for the
# static-file-server binary in cmd/server, and pushes the image to GHCR.
# Separate from release.yml (changelog + GitHub Release) — same split as
# environments-controller's ko.yml/release.yml, both firing on the same tag.
#
# No Dockerfile — this org builds/publishes images via ko.
#
# Registry: ghcr.io/blanketops/environments-docs
name: Ko Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_REPO: ghcr.io/blanketops/environments-docs

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Populates build/, which cmd/server/kodata symlinks to — ko bundles
      # it into the image automatically as static content.
      - name: Build site
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup ko
        uses: ko-build/setup-ko@v0.10

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # tag push → {version} + latest; manual dispatch → ref_name only
      - name: Compute image tags
        id: tags
        run: |
          TAGS="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS="${TAGS},latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: ko-build
        env:
          KO_DOCKER_REPO: ${{ env.IMAGE_REPO }}
        run: |
          ko build ./cmd/server --bare \
            --platform linux/amd64,linux/arm64 \
            --tags "${{ steps.tags.outputs.tags }}" \
            --image-refs /tmp/ko-image-refs
          echo "digest=$(tail -1 /tmp/ko-image-refs | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 🐹 Ko Image Build
          **Image:** \`${{ env.IMAGE_REPO }}\`
          **Tags:** \`${{ steps.tags.outputs.tags }}\`
          **Digest:** \`${{ steps.ko-build.outputs.digest }}\`
          ## Pull
          \`docker pull ${{ env.IMAGE_REPO }}:${{ github.ref_name }}\`
          EOF
