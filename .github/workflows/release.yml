# Tag-triggered: updates the changelog on main and publishes a GitHub
# Release. Image build/push is ko.yml — separate workflow, same trigger.
name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          GITCLIFF_VERSION="2.13.0"
          curl -L "https://github.com/orhun/git-cliff/releases/download/v${GITCLIFF_VERSION}/git-cliff-${GITCLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" -o git-cliff.tar.gz
          tar xzf git-cliff.tar.gz
          sudo mv "git-cliff-${GITCLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
          rm -rf git-cliff.tar.gz "git-cliff-${GITCLIFF_VERSION}"

      # The tag checkout above is a detached HEAD — switch to main so the
      # changelog commit below lands on a real branch, not the tag ref.
      - name: Checkout main
        run: |
          git checkout main
          git pull origin main

      - name: Generate CHANGELOG.md
        run: git-cliff --output CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update changelog for ${{ github.ref_name }}" || echo "No changes"
          git push origin main

      - name: Generate release notes
        run: git-cliff --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 📦 Release Published: ${{ github.ref_name }}
          ## Completed
          - Generated CHANGELOG.md using git-cliff and committed to main
          - Published GitHub Release with release notes
          ## Image
          Built separately by the **Ko Image** workflow, same tag trigger.
          EOF
