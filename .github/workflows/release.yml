# =============================================================================
# release.yml — Publish GitHub Release
#
# Triggers on version tags (v*). Generates contracts (buf gen via mage),
# changelog (git-cliff), publishes contract bundle to OCI registry, and
# publishes a GitHub Release with artifacts attached.
#
# Assets attached to the release:
#   - generated-contracts-<tag>.tar.gz  (Go .pb.go + TypeScript _pb.ts)
#   - RELEASE_NOTES.md                   (git-cliff output for this version)
#
# Note: This repo does not generate CRDs — that is handled by environments repo.
#==============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0


      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Install ORAS
        run: |
          if ! command -v oras >/dev/null 2>&1; then
            curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
              | tar -xz -C /usr/local/bin oras
          fi
          oras version
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          # 📦 GitHub Release Published

          **Version:** \`${{ github.ref_name }}\`

          ## Completed

          - Generated release notes via git-cliff
          - Published GitHub Release with assets

          ## Artifacts

          - RELEASE_NOTES.md (attached to release body)
          - GitHub Release

          ## Source Tag

          \`${{ github.ref_name }}\`

          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
