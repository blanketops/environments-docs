name: Release

# =============================================================================
# release.yml — Publish Secure Documentation Release & Artifacts
#
# Triggers on version tags (v*). Builds the Docusaurus site, generates release
# notes (git-cliff), creates an SPDX SBOM (quota-safe), signs artifacts with
# baked-in Cosign, generates build provenance, and publishes directly to
# GitHub Releases via gh.
# =============================================================================

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write     # Required for Sigstore keyless OIDC signing
  attestations: write # Required for GitHub native build provenance attestations

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run build

      - name: Package documentation site bundle
        run: |
          tar -czf "docs-site-${{ github.ref_name }}.tar.gz" -C build .

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0.18.0
        with:
          artifact-name: sbom-spdx-${{ github.ref_name }}
          output-file: sbom-${{ github.ref_name }}.spdx.json
          path: .
          format: spdx-json
          upload-artifact: false       # Bypasses internal artifact storage quota limits
          upload-release-assets: false # Handled directly by gh release create below

      - name: Sign Artifacts with Cosign (Keyless - using runner binary)
        run: |
          cosign sign-blob --yes \
            --output-signature docs-site-${{ github.ref_name }}.tar.gz.sig \
            docs-site-${{ github.ref_name }}.tar.gz

          cosign sign-blob --yes \
            --output-signature sbom-${{ github.ref_name }}.spdx.json.sig \
            sbom-${{ github.ref_name }}.spdx.json

      - name: Generate GitHub Native Artifact Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            docs-site-${{ github.ref_name }}.tar.gz
            sbom-${{ github.ref_name }}.spdx.json

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Create GitHub Release & Attach Assets via GitHub CLI (`gh`)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            docs-site-${{ github.ref_name }}.tar.gz \
            docs-site-${{ github.ref_name }}.tar.gz.sig \
            sbom-${{ github.ref_name }}.spdx.json \
            sbom-${{ github.ref_name }}.spdx.json.sig \
            RELEASE_NOTES.md

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Secure Documentation Release Published

          **Version:** `${{ github.ref_name }}`

          ## Supply Chain Security & Verification
          - **Docs Archive:** `docs-site-${{ github.ref_name }}.tar.gz` (+ `.sig`)
          - **SBOM Generated:** `sbom-${{ github.ref_name }}.spdx.json` (+ `.sig`, Quota-safe)
          - **Sigstore Signatures:** Attached via runner-baked Cosign OIDC
          - **GitHub Provenance:** Native build attestations verified
          - **Direct Upload:** Handled via baked-in GitHub CLI (`gh`)

          ## Attached Artifacts
          - `docs-site-${{ github.ref_name }}.tar.gz`
          - `docs-site-${{ github.ref_name }}.tar.gz.sig`
          - `sbom-${{ github.ref_name }}.spdx.json`
          - `sbom-${{ github.ref_name }}.spdx.json.sig`
          - `RELEASE_NOTES.md`

          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
