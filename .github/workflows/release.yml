# =============================================================================
# release.yml — Publish Secure GitHub Release & Supply Chain Artifacts
#
# Triggers on version tags (v*). Generates release notes (git-cliff),
# packages assets, generates SBOMs, cryptographically signs using Sigstore/Cosign,
# issues GitHub build attestations, and publishes to GitHub Releases.
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write     # Required for Sigstore keyless OIDC signing
  attestations: write # Required for GitHub native build provenance attestations

jobs:
  release:
    runs-on: self-hosted
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_ID_PRIVATE_KEY }}
          owner: blanketops
          repositories: environments-api

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Generate release notes
        run: git-cliff --config .cliff.toml --latest --output RELEASE_NOTES.md

      - name: Install ORAS
        run: |
          if ! command -v oras >/dev/null 2>&1; then
            curl -fsSL "https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz" \
              | tar -xz -C /usr/local/bin oras
          fi
          oras version

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Package Release Artifacts
        run: |
          tar -czf generated-contracts-${{ github.ref_name }}.tar.gz --exclude='.git' .

      # - name: Generate SBOM (Software Bill of Materials)
      #   uses: anchore/sbom-action@v0.18.0
      #   with:
      #     artifact-name: sbom-${{ github.ref_name }}.spdx.json
      #     output-file: sbom-${{ github.ref_name }}.spdx.json

      - name: Sign Artifacts with Sigstore Cosign (Keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature generated-contracts-${{ github.ref_name }}.tar.gz.sig \
            generated-contracts-${{ github.ref_name }}.tar.gz

          cosign sign-blob --yes \
            --output-signature sbom-${{ github.ref_name }}.spdx.json.sig \
            sbom-${{ github.ref_name }}.spdx.json

      - name: Generate GitHub Native Artifact Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            generated-contracts-${{ github.ref_name }}.tar.gz
            sbom-${{ github.ref_name }}.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            generated-contracts-${{ github.ref_name }}.tar.gz
            generated-contracts-${{ github.ref_name }}.tar.gz.sig
            sbom-${{ github.ref_name }}.spdx.json
            sbom-${{ github.ref_name }}.spdx.json.sig
            RELEASE_NOTES.md
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # 📦 Secure GitHub Release Published

          **Version:** `${{ github.ref_name }}`

          ## Supply Chain Security & Verification
          - **SBOM Generated:** `sbom-${{ github.ref_name }}.spdx.json`
          - **Sigstore Signatures:** Attached (`.sig` files) via keyless OIDC signing
          - **GitHub Provenance:** Native build attestations generated and verified

          ## Attached Artifacts
          - `generated-contracts-${{ github.ref_name }}.tar.gz` (+ `.sig`)
          - `sbom-${{ github.ref_name }}.spdx.json` (+ `.sig`)
          - `RELEASE_NOTES.md`

          EOF

      - name: Releaser complete
        if: always()
        uses: blanketops/environments-bots/.github/actions/releaser@v0.1.0
        with:
          command: complete
          release: ${{ github.ref_name }}
          app-id: ${{ vars.DEVELOPER_CLIENT_ID }}
          private-key: ${{ secrets.DEVELOPER_APP_PRIVATE_KEY }}
